<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><style>*{margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:transparent}#canvas{width:100%;height:100%;display:block}#error{position:absolute;top:0;left:0;color:red;font-size:14px;padding:8px;font-family:monospace;white-space:pre-wrap;z-index:999}</style></head><body><canvas id="canvas"></canvas><div id="error"></div><script src="http://localhost:8080/assets/live2d_web/lib/live2dcubismcore.min.js"></script><script src="http://localhost:8080/assets/live2d_web/lib/pixi.min.js"></script><script src="http://localhost:8080/assets/live2d_web/lib/cubism4.min.js"></script><script>function showError(m){document.getElementById("error").textContent=String(m);console.error(m)}window.onerror=function(m,s,l,c,e){showError("JS Error: "+m+(e&&e.stack?"\n"+e.stack:""))};(async function(){try{if(typeof Live2DCubismCore==="undefined")throw new Error("Live2DCubismCore not loaded (Cubism Core CDN failed)");const app=new PIXI.Application({view:document.getElementById("canvas"),autoStart:true,resizeTo:window,backgroundAlpha:0});const model=await PIXI.live2d.Live2DModel.from("http://localhost:8080/assets/live2d/Skeleton_Model/Skeleton_Model.model3.json");app.stage.addChild(model);function layout(){const s=Math.min(app.screen.width/model.width,app.screen.height/model.height);model.scale.set(s);model.x=(app.screen.width-model.width)/2;model.y=app.screen.height-model.height}layout();window.addEventListener("resize",layout);model.on("hit",function(h){if(h.includes("Body"))model.motion("Tap")});console.log("Live2D ready")}catch(e){showError("Load failed: "+(e&&e.stack?e.stack:e))}})();</script></body></html>
