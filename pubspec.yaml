name: kirakira
description: KiraKira - A shimmering AI companion app
publish_to: 'none'
version: 0.4.17+2

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Navigation
  go_router: ^13.0.1
  
  # Database
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  
  # Storage & Paths
  path_provider: ^2.1.1
  path: ^1.8.3
  shared_preferences: ^2.2.2
  
  # File Picker
  file_picker: ^8.0.0
  
  # Networking
  dio: ^5.4.0

  # 本地 embedding 推理（ONNX）
  onnxruntime: ^1.4.1
  
  # Image Processing
  image: ^4.1.3
  
  # Archive Handling
  archive: ^3.4.9
  
  # Code Generation (Runtime)
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  
  # Utils
  uuid: ^4.2.1
  intl: ^0.19.0
  collection: ^1.18.0
  equatable: ^2.0.5
  
  # UI Components
  cached_network_image: ^3.3.0
  flutter_markdown: ^0.6.18
  markdown: ^7.3.0
  flutter_inappwebview: ^6.0.0
  shimmer: ^3.0.0
  share_plus: ^12.0.1
  url_launcher: ^6.2.2
  
  # Image Picker
  image_picker: ^1.0.7
  photo_manager: 3.3.0
  
  # Google Drive Integration
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  video_player: ^2.10.0
  flutter_secure_storage: ^9.2.2
  http: ^1.6.0
  figma_squircle: ^0.6.3
  just_audio: ^0.10.6
  flutter_tts: ^4.2.5
  sherpa_onnx: ^1.13.8
  record: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # Code Generation
  build_runner: ^2.4.7
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  drift_dev: ^2.14.1
  go_router_builder: ^2.4.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/live2d/
    - assets/
    - assets/models/bge-small-zh/
    - assets/models/stt/
    - assets/images/
    - assets/icon/
    - assets/world_info/
    - assets/libs/
    - assets/chat/
  
  fonts:
    - family: LXGWWenKai
      fonts:
        - asset: assets/fonts/LXGWWenKaiGB-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
