plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.kirakira.app"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.kirakira.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            shrinkResources = false
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // [STT] onnxruntime插件(1.15.1)与sherpa_onnx(1.28.2)都打包了libonnxruntime.so。
    // 二选一保留:保留app本地jniLibs里放入的sherpa新版so(app输入在合并中最先),
    // onnxruntime插件走C API向后兼容,新版so对其无影响。
    packagingOptions {
        jniLibs {
            pickFirsts += ['lib/**/libonnxruntime.so']
        }
    }
}

flutter {
    source = "../.."
}
